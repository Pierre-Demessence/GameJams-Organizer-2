name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamejams
          POSTGRES_PASSWORD: gamejams
          POSTGRES_DB: gamejams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamejams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Server-action integration tests provision and target this dedicated DB.
      TEST_DATABASE_URL: postgresql://gamejams:gamejams@localhost:5432/gamejams_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Tests share one DB and truncate between tests (fileParallelism: false).
      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamejams
          POSTGRES_PASSWORD: gamejams
          POSTGRES_DB: gamejams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamejams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gamejams:gamejams@localhost:5432/gamejams
      # CI-only placeholder secret; never used against real users.
      NEXTAUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
