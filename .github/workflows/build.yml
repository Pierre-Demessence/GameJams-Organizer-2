name: Build

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref (branch, tag, or SHA) to build from"
        required: true
        type: string
    outputs:
      short_sha:
        description: "Short SHA of the built commit"
        value: ${{ jobs.build.outputs.short_sha }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pierre-demessence/gamejams-organizer-2

jobs:
  build:
    name: Build & push app + migrator images
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}:migrate-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
