# Optional bootstrap config: comma-separated emails promoted to Site Admin on
# sign-in (see promoteInitialAdmin in src/lib/auth.ts). Kept separate from the
# main app secret and consumed via an OPTIONAL envFrom, so a missing 1Password
# field never blocks the app from starting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gamejams-admin
  namespace: gamejams-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: gamejams
    app.kubernetes.io/part-of: gamejams
    environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gamejams-admin
    creationPolicy: Owner
  data:
    - secretKey: INITIAL_ADMIN_EMAILS
      remoteRef:
        key: gamejams-dev
        property: initial-admin-emails
