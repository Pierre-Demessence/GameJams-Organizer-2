# Runs `prisma migrate deploy` before the app rolls out. As an ArgoCD Sync hook
# the Job is deleted and recreated on every sync, so new migrations always apply.
# The initContainer waits for Postgres so ordering is race-free on first sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: gamejams-migrate
  namespace: gamejams-dev
  labels:
    app.kubernetes.io/name: gamejams-migrate
    app.kubernetes.io/part-of: gamejams
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Run after Postgres (wave 0) and before the app Deployment (wave 2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamejams-migrate
        app.kubernetes.io/part-of: gamejams
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - "until pg_isready -h gamejams-db -U gamejams; do echo 'waiting for db'; sleep 2; done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: migrate
          image: ghcr.io/pierre-demessence/gamejams-organizer-2:migrate-8443400
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gamejams
                  key: DATABASE_URL
            # pnpm/prisma write caches and extract the engine under $HOME and /tmp.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

