apiVersion: v1
kind: Service
metadata:
  name: gamejams-db
  namespace: gamejams-prod
  labels:
    app.kubernetes.io/name: gamejams-db
    app.kubernetes.io/part-of: gamejams
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gamejams-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gamejams-db
  namespace: gamejams-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: gamejams-db
    app.kubernetes.io/part-of: gamejams
    environment: prod
spec:
  serviceName: gamejams-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gamejams-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamejams-db
        app.kubernetes.io/part-of: gamejams
    spec:
      # The official postgres image manages its own uid (drops from root via the
      # entrypoint) and chowns the data dir, so we don't pin runAsUser here.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gamejams
            - name: POSTGRES_DB
              value: gamejams
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamejams
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gamejams", "-d", "gamejams"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gamejams", "-d", "gamejams"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
