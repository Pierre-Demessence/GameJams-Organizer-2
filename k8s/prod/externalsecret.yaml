apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gamejams
  namespace: gamejams-prod
  annotations:
    # Materialize the Secret before Postgres and the app need it.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: gamejams
    app.kubernetes.io/part-of: gamejams
    environment: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gamejams
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .postgresPassword }}"
        NEXTAUTH_SECRET: "{{ .nextauthSecret }}"
        AUTH_DISCORD_ID: "{{ .discordId }}"
        AUTH_DISCORD_SECRET: "{{ .discordSecret }}"
        DATABASE_URL: "postgresql://gamejams:{{ .postgresPassword }}@gamejams-db:5432/gamejams?schema=public"
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: gamejams-prod
        property: postgres-password
    - secretKey: nextauthSecret
      remoteRef:
        key: gamejams-prod
        property: nextauth-secret
    - secretKey: discordId
      remoteRef:
        key: gamejams-prod
        property: discord-id
    - secretKey: discordSecret
      remoteRef:
        key: gamejams-prod
        property: discord-secret
